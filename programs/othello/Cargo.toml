[package]
name = "othello"
version = "0.1.0"
description = "Othello: xStock-backed mutual credit circle"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "othello"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Test-only instructions. Never enabled for a deployed build; see lib.rs.
harness = []

[dependencies]
# `init-if-needed` is required for the ATA constraints in join_and_lock. The
# feature's documented danger is re-initialisation resetting a program-owned
# account's state; every use here is an Associated Token Account, whose address
# is derived from (mint, authority) and which Anchor validates rather than
# rewrites when it already exists. No Othello state account uses it.
anchor-lang = { version = "~1.1", features = ["init-if-needed"] }
# Default features already carry token_2022, token_2022_extensions,
# spl-token-2022-interface and spl-pod, which T02/T03 need for
# ScaledUiAmountConfig and PodF64. Resolved versions are recorded in DONE.md.
anchor-spl = "~1.1"

# Test-only. The fixture-agreement test reads tests/fixtures/*.json, which the
# T00 fetcher wrote as base64 inside JSON. Both crates are already in the
# lockfile as transitive dependencies of anchor-spl, so this adds no new code
# to the dependency tree and none of it reaches the program.
[dev-dependencies]
base64 = "0.22"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
