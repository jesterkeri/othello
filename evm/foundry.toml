[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
gas_limit = "18446744073709551615"
memory_limit = 1073741824
fs_permissions = [{ access = "read", path = "../core/vectors" }, { access = "read", path = "./test/fixtures" }, { access = "read", path = "./script" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512
seed = "0x0ade11"

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[lint]
lint_on_build = false
