<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#EDF0EA; --surface:#FFFFFF; --ink:#0D0F0C; --muted:#4A5249; --line:#0D0F0C;
  --felt:#1E7B4B; --felt-ink:#FFFFFF; --amber:#FFC53D; --red:#FF4D3D; --green:#3DDC84;
  --shadow:#0D0F0C; --code:#E3E8DF; --mermaid-bg:#FFFFFF;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1210; --surface:#181D19; --ink:#EDF0EA; --muted:#A7B0A5; --line:#EDF0EA;
  --felt:#23915A; --amber:#F2B632; --red:#FF6A5C; --green:#3DDC84; --shadow:#EDF0EA; --code:#1F2621; --mermaid-bg:#FFFFFF;}}
:root[data-theme="dark"]{
  --paper:#0F1210; --surface:#181D19; --ink:#EDF0EA; --muted:#A7B0A5; --line:#EDF0EA;
  --felt:#23915A; --amber:#F2B632; --red:#FF6A5C; --green:#3DDC84; --shadow:#EDF0EA; --code:#1F2621; --mermaid-bg:#FFFFFF;}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--body);padding-inline:16px}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px}
header.top{grid-column:1/-1;background:var(--felt);color:var(--felt-ink);border:3px solid var(--line);box-shadow:6px 6px 0 var(--shadow);padding:22px 24px;display:flex;align-items:center;gap:18px}
header.top .bigdisc{flex:none;width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);background:var(--disc);box-shadow:3px 3px 0 var(--ink)}
header.top h1{font:800 clamp(28px,5vw,48px)/1 var(--display);margin:0;letter-spacing:-.01em}
header.top .kicker{font:600 12px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;margin-top:6px;opacity:.9}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:14px}
nav.toc::before{content:"Contents";font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
nav.toc a{color:var(--ink);text-decoration:none;font:500 13px/1.35 var(--body);padding:4px 6px;border:2px solid transparent}
nav.toc a:hover,nav.toc a:focus-visible{border-color:var(--line);background:var(--amber);color:#0D0F0C;outline:none}
main{min-width:0}
.masthead{display:flex;gap:14px;align-items:flex-start;background:var(--amber);color:#0D0F0C;border:3px solid var(--line);box-shadow:5px 5px 0 var(--shadow);padding:16px 18px;margin-bottom:28px}
.masthead p{margin:0;max-width:75ch}
.masthead code{background:rgba(0,0,0,.08);color:#0D0F0C}
.disc{flex:none;width:22px;height:22px;border-radius:50%;background:#0D0F0C;margin-top:2px;box-shadow:inset -4px -4px 0 #FFFFFF33}
h2{font:800 clamp(22px,3vw,30px)/1.15 var(--display);text-wrap:balance;margin:44px 0 10px;padding-top:6px;display:flex;align-items:center;gap:12px;scroll-margin-top:16px}
h2::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;background:var(--ink);border:2px solid var(--line)}
h3{font:700 19px/1.25 var(--display);margin:30px 0 8px}
p,li{max-width:72ch}
a{color:var(--felt)}
.stamp{display:inline-block;max-width:100%;font:500 12px/1.5 var(--mono);background:var(--surface);border:2px solid var(--line);padding:4px 10px;margin:0 0 14px;color:var(--muted)}
code{font:13px var(--mono);background:var(--code);padding:1px 5px;border-radius:0}
pre.code{background:var(--surface);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:14px 16px;overflow-x:auto;font:13px/1.55 var(--mono)}
pre.code code{background:none;padding:0}
.tbl{overflow-x:auto;border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);background:var(--surface);margin:14px 0 22px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th{background:var(--ink);color:var(--paper);text-align:left;font:600 12px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;white-space:nowrap}
td{border-top:1.5px solid var(--line);padding:8px 10px;vertical-align:top;min-width:90px}
td strong{background:var(--amber);color:#0D0F0C;padding:0 3px}
.diagram{overflow-x:auto;background:var(--mermaid-bg);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:14px;margin:14px 0 22px}
.diagram pre.mermaid{margin:0;background:transparent;color:#0D0F0C;min-width:520px}
.pill{display:inline-block;font:600 11.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:4px 8px;border:2px solid var(--line);color:#0D0F0C;white-space:nowrap}
.pill.red{background:var(--red)}.pill.green{background:var(--green)}
footer{grid-column:1/-1;font:12px var(--mono);color:var(--muted);border-top:2px solid var(--line);padding-top:12px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}nav.toc{position:static;flex-direction:row;flex-wrap:wrap}nav.toc::before{width:100%}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
html{scroll-behavior:smooth}
</style>
<div class="wrap" style="--disc:{{DISC}}">
<header class="top"><span class="bigdisc" style="background:{{DISC}}"></span><div><h1>{{H1}}</h1><div class="kicker">{{KICKER}}</div></div></header>
<nav class="toc" aria-label="Sections">{{NAV}}</nav>
<main>{{BODY}}</main>
<footer>Othello · Stocklana hackathon · devnet · generated from atlas/*.md in the repo. The markdown is the source; this page is republished from it.</footer>
</div>
