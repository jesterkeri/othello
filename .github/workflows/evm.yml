# Robinhood Chain (EVM) contracts and the shared reference model (ARB-DESIGN r9 section 7).
name: evm

on:
  pull_request:
    paths: ["evm/**", "core/**", "app/**", "tests/robinhood-*", "tests/chain-switch.spec.ts", "tests/evm-*.spec.ts", "tests/a2-*", "tests/artifacts.ts", "tests/config-fixture.ts", "tests/core-profiles.spec.ts", "tests/trust-config*", "ops/trust-config.ts", "ops/release-robinhood.sh", "ops/release-deploy.ts", "ops/release-target.json", "ops/vercel-cli/**", "*", ".*", "tests/release-deploy*", "tests/release-script-*", "tests/release-ci-*", "tests/reviewed-settings.ts", "tests/fake-pinned-cli.ts", "tests/release-script-harness.ts", ".github/workflows/evm.yml", "tests/a2-*.spec.ts"]
  push:
    branches: ["task/A1-*", "staging", "main", "task/A2-*"]
    paths: ["evm/**", "core/**", "app/**", "tests/robinhood-*", "tests/chain-switch.spec.ts", "tests/evm-*.spec.ts", "tests/a2-*", "tests/artifacts.ts", "tests/config-fixture.ts", "tests/core-profiles.spec.ts", "tests/trust-config*", "ops/trust-config.ts", "ops/release-robinhood.sh", "ops/release-deploy.ts", "ops/release-target.json", "ops/vercel-cli/**", "*", ".*", "tests/release-deploy*", "tests/release-script-*", "tests/release-ci-*", "tests/reviewed-settings.ts", "tests/fake-pinned-cli.ts", "tests/release-script-harness.ts", ".github/workflows/evm.yml", "tests/a2-*.spec.ts"]

permissions:
  contents: read

concurrency:
  group: evm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: reference model and vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Model, profile split and generator tests (also fail if vectors are stale)
        run: python3 -W error::ResourceWarning -m unittest core/test_core.py -v
      - name: Vector manifests
        run: |
          set -e
          for d in core/vectors/v1/*/; do (cd "$d" && sha256sum -c --quiet MANIFEST.sha256); done
          echo "manifests ok"

  foundry:
    name: contracts (unit, vector replay, invariants)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: v1.8.1 }
      - name: Build (sizes under 24 KB)
        run: forge build --sizes
      - name: Tests (the Robinhood fork suite runs in its own job)
        run: forge test -vv --no-match-contract ForkRobinhood
      - name: App ABIs match the build
        run: python3 script/export_abi.py --check

  adapter:
    name: Robinhood adapter against the contracts (anvil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # full history: with the factory set, the release and gate specs need the deployed commit (3429255) in it
        with: { persist-credentials: false, submodules: recursive, fetch-depth: 0 }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: v1.8.1 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build contracts
        run: cd evm && forge build
      - name: Install (lockfiles frozen, install scripts off)
        run: |
          npx --yes pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          npx --yes pnpm@10.32.1 -C app install --frozen-lockfile --ignore-scripts
      - name: Type checks (root includes the adapter type-level tests)
        run: npx tsc --noEmit && npx --yes pnpm@10.32.1 -C app typecheck
      - name: The pinned Vercel CLI, whose own file collector the release specs compare against; pnpm for the release script's build
        run: npm install -g vercel@59.11.7 pnpm@10.32.1
      - name: The release keeps only PATH folders no other user can write (Codex r6 F1); hosted runners share their tool cache
        run: |
          for d in $(echo "$PATH" | tr ':' ' '); do [ -d "$d" ] && stat -c '%U %a %n' "$d"; done
          stat -c '%U %a %n' /opt /opt/hostedtoolcache 2>/dev/null || true
          # hosted runners leave /opt, /usr/local/bin and the tool cache writable by every user (777); the release would
          # (correctly) drop node and pnpm there, so this single-use VM is tightened first, then the folders are shown again
          sudo chmod go-w /opt /usr/local/bin
          sudo chmod -R go-w /opt/hostedtoolcache
          for d in /opt /opt/hostedtoolcache /usr/local/bin "$(dirname "$(command -v node)")"; do stat -L -c '%U %a %n' "$d"; done
      - name: Adapter, trust check and profile tests
        run: npx mocha --import=tsx --timeout 300000 tests/core-profiles.spec.ts tests/robinhood-adapter.spec.ts tests/robinhood-adapter-leftover-approval.spec.ts tests/robinhood-adapter-cancelled-action.spec.ts tests/robinhood-create-list-adversary.spec.ts tests/robinhood-adapter-repriced-topup.spec.ts tests/robinhood-my-circles.spec.ts tests/chain-switch.spec.ts tests/evm-discovery.spec.ts tests/evm-session.spec.ts tests/evm-session-reswitch-overlap-adversary.spec.ts tests/release-deploy.spec.ts tests/release-deploy-uploads-adversary.spec.ts tests/release-deploy-compiled-config-adversary.spec.ts tests/release-deploy-absolute-filepathmap-adversary.spec.ts tests/release-deploy-dir-link-text-adversary.spec.ts tests/release-deploy-upload-mode-adversary.spec.ts tests/release-deploy-empty-dir-mode-adversary.spec.ts tests/release-deploy-vercel-dir-link-adversary.spec.ts tests/release-deploy-link-text-newline-adversary.spec.ts tests/release-deploy-linked-vc-config-adversary.spec.ts tests/release-deploy-project-json-repo-root-adversary.spec.ts tests/release-deploy-ancestor-repo-link-adversary.spec.ts tests/release-deploy-root-services-config-adversary.spec.ts tests/release-deploy-npx-versioned-bin-adversary.spec.ts tests/release-deploy-app-builders-dir-adversary.spec.ts tests/release-deploy-app-env-file-adversary.spec.ts tests/release-deploy-npm-node-options-adversary.spec.ts tests/release-deploy-clone-ancestors-adversary.spec.ts tests/release-deploy-tsx-cache-adversary.spec.ts tests/release-deploy-failed-scan-record-adversary.spec.ts tests/release-deploy-record-copy-failure-adversary.spec.ts tests/release-deploy-voided-throw-adversary.spec.ts tests/release-deploy-void-write-throw-adversary.spec.ts tests/release-deploy-target-at-deploy-adversary.spec.ts tests/release-deploy-run-cli-target-adversary.spec.ts tests/release-deploy-uncommitted-target-adversary.spec.ts tests/release-deploy-replaced-head-target-adversary.spec.ts tests/release-deploy-home-git-ignore-adversary.spec.ts tests/release-deploy-worktree-ignore-adversary.spec.ts tests/release-deploy-linked-worktree-gitfile-adversary.spec.ts tests/release-deploy-backslash-name-adversary.spec.ts tests/release-deploy-vercel-settings.spec.ts tests/release-script-pulled-settings.spec.ts tests/release-script-global-git-config.spec.ts tests/release-script-pulled-env-program-adversary.spec.ts tests/release-script-repo-filter-adversary.spec.ts tests/release-script-submodule-filter-adversary.spec.ts tests/release-script-repo-pager-adversary.spec.ts tests/release-script-staged-gitlink-adversary.spec.ts tests/release-script-retargeted-gitlink-adversary.spec.ts tests/release-script-lazy-fetch-adversary.spec.ts tests/release-script-empty-driver-name-adversary.spec.ts tests/release-script-normal-clone-adversary.spec.ts tests/release-script-non-utf8-driver-name-adversary.spec.ts tests/release-script-locale-gitlink-grep-adversary.spec.ts tests/release-script-locale-env-seal-adversary.spec.ts tests/release-ci-path-triggers-adversary.spec.ts tests/release-ci-root-build-config-adversary.spec.ts tests/release-ci-a2-helper-triggers-adversary.spec.ts tests/release-script-path-trust.spec.ts tests/release-script-path-symlink-adversary.spec.ts tests/release-script-gitin-path-adversary.spec.ts tests/release-script-path-program-link-adversary.spec.ts tests/release-script-path-parent-owner-adversary.spec.ts tests/release-deploy-hidden-count-adversary.spec.ts tests/release-script-path-child-program-link-adversary.spec.ts tests/release-deploy-shared-projectid-shape-adversary.spec.ts tests/release-script-path-colon-folder-adversary.spec.ts tests/trust-config.spec.ts tests/trust-config-hostile-config.spec.ts tests/trust-config-trust-sources.spec.ts tests/trust-config-shadow-module.spec.ts tests/trust-config-rename-hides-delete.spec.ts tests/trust-config-extensionless-shadow.spec.ts tests/trust-config-subpath-imports.spec.ts tests/trust-config-bundle-scan-misses.spec.ts tests/trust-config-prebuilt-upload-set.spec.ts tests/trust-config-quoted-path-adversary.spec.ts tests/release-script-xdg-data-home-adversary.spec.ts tests/trust-config-ignored-gitlink-adversary.spec.ts tests/trust-config-ref-named-commit-adversary.spec.ts tests/trust-config-moved-receipt-commit-adversary.spec.ts tests/trust-config-head-named-file-adversary.spec.ts tests/trust-config-forged-commit-graph-adversary.spec.ts tests/trust-config-forged-tree-object-adversary.spec.ts tests/trust-config-long-names-adversary.spec.ts tests/trust-config-orphan-worktree-fsck-adversary.spec.ts
      - name: A2 wallet specs, one process each (each installs module loader hooks that stub React; two in one process clash)
        run: for f in tests/a2-solana-no-connect-on-load.spec.ts tests/a2-cancelled-pick-adversary.spec.ts tests/a2-cancelled-solana-rearmed-adversary.spec.ts tests/a2-closed-solana-reopened-adversary.spec.ts tests/a2-modal-render-adversary.spec.ts tests/a2-modal-search-adversary.spec.ts tests/a2-wallet-answers-adversary.spec.ts; do npx mocha --import=tsx --timeout 300000 "$f" || exit 1; done

  fork:
    name: real USDG on a Robinhood testnet fork (read-only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: v1.8.1 }
      - name: Fork tests against https://rpc.testnet.chain.robinhood.com (nothing is broadcast)
        run: forge test -vv --match-contract ForkRobinhood

  trust-config:
    name: trust-config (the page's factory address and hash vs receipt, chain and reviewed source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, submodules: recursive, fetch-depth: 0 }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: v1.8.1 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd evm && forge build
      - run: npx --yes pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - run: npx --yes pnpm@10.32.1 -C app install --frozen-lockfile --ignore-scripts
      - name: Build the app (the bundle scan reads what the browser receives)
        run: cd app && npx next build
      - name: Verify (fails closed once TRUSTED_FACTORY is set)
        run: npx tsx ops/trust-config.ts --rpc https://rpc.testnet.chain.robinhood.com --build app/.next
      - name: Vercel prebuilt output, built offline the way ops/release-robinhood.sh builds it, then scanned
        run: |
          npm install -g pnpm@10.32.1   # vercel build runs "pnpm run build" and needs pnpm on PATH
          mkdir -p app/.vercel
          # the link's settings are the reviewed document itself (ops/release-target.json vercelSettings, Codex r5 F1):
          # the install step skipped, no build/output/dev override, the dependencies are the two installs above
          node -e 'const t = require("./ops/release-target.json"); require("fs").writeFileSync("app/.vercel/project.json", JSON.stringify({ projectId: "ci-offline", orgId: "ci-offline", settings: t.vercelSettings }))'
          CLI_DIR="$(mktemp -d)"
          VC="$(npx tsx ops/release-deploy.ts --install-cli "$CLI_DIR")"   # the release's verified CLI, from its lockfile
          (cd app && node "$VC" build --yes)
          npx tsx ops/trust-config.ts --rpc https://rpc.testnet.chain.robinhood.com --vercel-output app/.vercel/output
